<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1746b0">
  <title>Job Pool · VehicleCare</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content" id="content" hidden>
        <div class="page-head">
          <div>
            <h1 id="pageHeading">Job Pool</h1>
            <p id="pageIntro">Post a job and let nearby caretakers send you their price. Pick the best offer.</p>
          </div>
          <button type="button" class="btn btn-primary hidden" id="postJobBtn" data-icon="plus">Post a job</button>
        </div>

        <div class="callout hidden" id="locationCallout" style="margin-bottom:18px"></div>

        <section class="card hidden" id="mapCard" style="margin-bottom:18px">
          <div class="card-head"><h2>Jobs in your service area</h2><span class="small muted" id="mapNote"></span></div>
          <div class="card-body" style="padding:12px"><div class="map-panel" id="jobMap"></div></div>
        </section>

        <div class="toolbar">
          <div class="tabs" id="statusTabs">
            <button type="button" class="tab active" data-status="open">Open</button>
            <button type="button" class="tab" data-status="assigned">Assigned</button>
            <button type="button" class="tab" data-status="cancelled">Cancelled</button>
            <button type="button" class="tab" data-status="all">All</button>
          </div>
        </div>
        <div class="grid grid-2" id="jobList"><div class="loading">Loading…</div></div>
      </main>
    </div>
  </div>

  <!-- Owner: post a job -->
  <dialog id="postDialog" aria-labelledby="postTitle">
    <form id="postForm">
      <div class="dialog-head">
        <h2 id="postTitle">Post a job</h2>
        <button type="button" class="icon-btn" data-close aria-label="Close" data-icon="x"></button>
      </div>
      <div class="dialog-body">
        <div class="form-alert" role="alert"></div>
        <p class="small muted">Every caretaker whose service area covers the vehicle is notified and can send a price.</p>
        <div class="form-grid">
          <div class="field full">
            <label for="jVehicle">Vehicle <span class="req">*</span></label>
            <select id="jVehicle" name="vehicle_id" required></select>
            <div class="hint" id="jVehicleHint"></div>
            <div class="field-error"></div>
          </div>
          <div class="field full">
            <label for="jTitle">What needs doing? <span class="req">*</span></label>
            <input id="jTitle" name="title" required minlength="3" maxlength="120" list="jobIdeas" placeholder="e.g. Weekly engine start and battery check for a month">
            <datalist id="jobIdeas">
              <option value="Weekly engine start and battery check for a month">
              <option value="Monsoon rodent-proofing and underbody check">
              <option value="Wash, polish and fit a breathable cover">
              <option value="Full inspection with photos before I return">
              <option value="Take the vehicle for insurance inspection">
            </datalist>
            <div class="field-error"></div>
          </div>
          <div class="field">
            <label for="jDate">Preferred date</label>
            <input id="jDate" name="preferred_date" type="date">
            <div class="field-error"></div>
          </div>
          <div class="field">
            <label for="jBudget">Budget (₹)</label>
            <input id="jBudget" name="budget" type="number" min="0" step="1" placeholder="Optional">
            <div class="field-error"></div>
          </div>
          <div class="field full">
            <label for="jDesc">Details</label>
            <textarea id="jDesc" name="description" maxlength="1000" placeholder="Where are the keys? Anything the caretaker should know?"></textarea>
            <div class="field-error"></div>
          </div>
        </div>
      </div>
      <div class="dialog-foot">
        <button type="button" class="btn btn-ghost" data-close>Cancel</button>
        <button type="submit" class="btn btn-primary">Post job</button>
      </div>
    </form>
  </dialog>

  <!-- Owner: bids for a job -->
  <dialog id="bidsDialog" aria-labelledby="bidsTitle">
    <div class="dialog-head">
      <h2 id="bidsTitle">Bids</h2>
      <button type="button" class="icon-btn" data-close aria-label="Close" data-icon="x"></button>
    </div>
    <div class="dialog-body" id="bidsBody"></div>
    <div class="dialog-foot"><button type="button" class="btn btn-ghost" data-close>Close</button></div>
  </dialog>

  <!-- Caretaker: place a bid -->
  <dialog id="bidDialog" class="small" aria-labelledby="bidTitle">
    <form id="bidForm">
      <div class="dialog-head">
        <h2 id="bidTitle">Place a bid</h2>
        <button type="button" class="icon-btn" data-close aria-label="Close" data-icon="x"></button>
      </div>
      <div class="dialog-body">
        <div class="form-alert" role="alert"></div>
        <p class="small" id="bidSummary"></p>
        <input type="hidden" name="job_id">
        <div class="field">
          <label for="bPrice">Your price (₹) <span class="req">*</span></label>
          <input id="bPrice" name="price" type="number" min="0" step="1" required>
          <div class="field-error"></div>
        </div>
        <div class="field" style="margin-top:12px">
          <label for="bMessage">Message to the owner</label>
          <textarea id="bMessage" name="message" maxlength="500" placeholder="When can you come? What is included?"></textarea>
          <div class="field-error"></div>
        </div>
      </div>
      <div class="dialog-foot">
        <button type="button" class="btn btn-ghost" data-close>Cancel</button>
        <button type="submit" class="btn btn-primary">Send bid</button>
      </div>
    </form>
  </dialog>

  <script src="/vendor/leaflet/leaflet.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/map.js"></script>
  <script src="/js/reviews.js"></script>
  <script src="/js/jobs.js"></script>
</body>
</html>
