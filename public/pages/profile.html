<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1746b0">
  <title>Profile · VehicleCare</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content" id="content" hidden>
        <div class="page-head">
          <div>
            <h1 id="pageHeading">Profile</h1>
            <p id="pageIntro">Your contact details.</p>
          </div>
        </div>

        <div class="card card-body hidden" id="welcome" style="margin-bottom:18px;border-color:var(--blue-200);background:var(--blue-50)">
          <strong>Welcome to VehicleCare!</strong> Add your city, phone and skills so vehicle owners can find you in the provider directory.
        </div>

        <section class="card card-body caretaker-only hidden" id="ratingCard" style="max-width:760px;margin-bottom:18px"></section>

        <section class="card" style="max-width:760px">
          <form id="profileForm">
            <div class="card-body">
              <div class="form-alert" role="alert"></div>
              <div class="form-grid">
                <div class="field">
                  <label for="pName">Full name <span class="req">*</span></label>
                  <input id="pName" name="full_name" required minlength="2" maxlength="100" autocomplete="name">
                  <div class="field-error"></div>
                </div>
                <div class="field">
                  <label for="pEmail">Email</label>
                  <input id="pEmail" name="email_display" disabled>
                  <div class="hint">Email cannot be changed.</div>
                </div>
                <div class="field">
                  <label for="pPhone">Phone</label>
                  <input id="pPhone" name="phone" type="tel" maxlength="20" autocomplete="tel" placeholder="+91 98470 00000">
                  <div class="field-error"></div>
                </div>
                <div class="field">
                  <label for="pCity">City</label>
                  <input id="pCity" name="city" maxlength="80" autocomplete="address-level2">
                  <div class="field-error"></div>
                </div>
                <div class="field full caretaker-only hidden">
                  <label for="pSpec">Services you offer</label>
                  <input id="pSpec" name="specialization" maxlength="120" placeholder="e.g. Battery checks, tyre care, detailing">
                  <div class="field-error"></div>
                </div>
                <div class="field full caretaker-only hidden">
                  <label for="pBio">About you</label>
                  <textarea id="pBio" name="bio" maxlength="500" placeholder="Experience, areas you cover, availability…"></textarea>
                  <div class="field-error"></div>
                </div>
                <div class="field full caretaker-only hidden">
                  <label for="pRadius">Service area <span class="muted small">(where you are based and how far you travel)</span></label>
                  <div id="areaMap"></div>
                  <div style="display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap">
                    <span class="small">I travel up to</span>
                    <select id="pRadius" name="service_radius_km" style="max-width:140px">
                      <option value="5">5 km</option>
                      <option value="10">10 km</option>
                      <option value="15">15 km</option>
                      <option value="20">20 km</option>
                      <option value="30">30 km</option>
                      <option value="50">50 km</option>
                      <option value="100">100 km</option>
                    </select>
                    <span class="small muted">Owners and job posts inside this circle can find you.</span>
                  </div>
                  <div class="field-error"></div>
                </div>
              </div>
            </div>
            <div class="dialog-foot" style="border-radius:0 0 12px 12px">
              <button type="submit" class="btn btn-primary">Save profile</button>
            </div>
          </form>
        </section>
      </main>
    </div>
  </div>
  <script src="/vendor/leaflet/leaflet.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/map.js"></script>
  <script src="/js/reviews.js"></script>
  <script src="/js/profile.js"></script>
</body>
</html>
